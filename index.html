<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noto — A little space for what's next</title>

  <!-- Inline Base64 SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'%3E%3Crect width='32' height='32' rx='7' fill='%23081A2B'/%3E%3Crect x='0.75' y='0.75' width='30.5' height='30.5' rx='6.25' fill='none' stroke='%23193552' stroke-width='1.5'/%3E%3Cg fill='none' stroke='%235CB8FF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cline x1='9.5' y1='8' x2='9.5' y2='24'/%3E%3Cline x1='9.5' y1='8' x2='22.5' y2='24'/%3E%3Cline x1='22.5' y1='8' x2='22.5' y2='24'/%3E%3C/g%3E%3Ccircle cx='22.5' cy='8' r='1.5' fill='%238CCBFF'/%3E%3C/svg%3E">

  <!-- Google Font: Sora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       Design System & Tokens
       ========================================================================== */
    :root {
      --navy-bg: #091726;
      --navy-surface: #0E2238;
      --navy-surface-hover: #142F4C;
      --navy-panel: #0D2034;
      --navy-row-hover: #112841;

      --blue-primary: #4DA3FF;
      --blue-accent-hover: #3692F5;
      --blue-soft: #8CCBFF;
      --blue-glow: rgba(77, 163, 255, 0.22);
      --blue-subtle: rgba(77, 163, 255, 0.08);

      --text-pure: #FFFFFF;
      --text-primary: #EBF3FC;
      --text-secondary: #97B1CB;
      --text-muted: #577390;
      --text-faint: #304760;

      --border-subtle: #193552;
      --danger-hover: #FF6666;
      --danger-bg: rgba(255, 102, 102, 0.12);

      --font-main: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-smooth: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius-sm: 6px;
      --radius-md: 10px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
    }

    body {
      background-color: var(--navy-bg);
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 3rem 1.5rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-x: hidden;
    }

    .glow-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(120px);
      z-index: 0;
    }

    .glow-top-right {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(77, 163, 255, 0.08) 0%, rgba(9, 23, 38, 0) 70%);
      top: -100px;
      right: -100px;
    }

    .glow-bottom-left {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(65, 120, 190, 0.06) 0%, rgba(9, 23, 38, 0) 70%);
      bottom: -150px;
      left: -150px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .app-layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 2.75rem;
    }

    .app-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-mark {
      width: 8px;
      height: 8px;
      background-color: var(--blue-primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--blue-primary);
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text-pure);
    }

    .accent-dot {
      color: var(--blue-primary);
    }

    .brand-divider {
      color: var(--border-subtle);
      font-size: 0.85rem;
    }

    .brand-tagline {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .topbar-meta {
      text-align: right;
      display: flex;
      flex-direction: column;
    }

    .meta-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--blue-soft);
    }

    .meta-time {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 3.5rem;
      align-items: start;
    }

    .primary-column {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .hero-block {
      margin-bottom: 2rem;
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-pure);
      line-height: 1.2;
    }

    .hero-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-top: 0.35rem;
    }

    .task-composer {
      margin-bottom: 2rem;
    }

    .input-shell {
      display: flex;
      align-items: center;
      background-color: var(--navy-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.4rem 0.5rem 0.4rem 1.15rem;
      transition: border-color var(--ease-smooth), background-color var(--ease-smooth), box-shadow var(--ease-smooth);
    }

    .input-shell:focus-within {
      border-color: var(--blue-primary);
      background-color: var(--navy-surface-hover);
      box-shadow: 0 0 0 3px var(--blue-glow), 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    .input-icon {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--blue-primary);
      margin-right: 0.75rem;
      line-height: 1;
      transition: transform var(--ease-spring);
    }

    .input-shell:focus-within .input-icon {
      transform: rotate(90deg) scale(1.1);
    }

    .composer-field {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-pure);
      outline: none;
      padding: 0.55rem 0;
    }

    .composer-field::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .composer-submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background-color: var(--blue-primary);
      color: #051321;
      border: none;
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.65rem 1.15rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color var(--ease-smooth), transform var(--ease-smooth), box-shadow var(--ease-smooth);
    }

    .composer-submit-btn:hover {
      background-color: var(--blue-accent-hover);
      box-shadow: 0 0 12px var(--blue-glow);
    }

    .composer-submit-btn:focus-visible {
      outline: 2px solid var(--blue-soft);
      outline-offset: 2px;
    }

    .composer-submit-btn:active {
      transform: scale(0.96);
    }

    .btn-arrow {
      font-size: 0.9rem;
      transition: transform var(--ease-smooth);
    }

    .composer-submit-btn:hover .btn-arrow {
      transform: translateX(3px);
    }

    .task-feed {
      display: flex;
      flex-direction: column;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 1.15rem;
      padding: 0.95rem 0.65rem;
      border-bottom: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      transition: background-color var(--ease-smooth), opacity var(--ease-smooth), transform var(--ease-smooth);
      animation: taskSlide 200ms ease forwards;
    }

    @keyframes taskSlide {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-row:hover {
      background-color: var(--navy-row-hover);
    }

    .task-order {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-faint);
      min-width: 22px;
      user-select: none;
    }

    .checkbox-shell {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      margin: -4px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .checkbox-native {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      margin: 0;
    }

    .checkbox-skin {
      width: 20px;
      height: 20px;
      border: 1.5px solid var(--text-muted);
      border-radius: 5px;
      background-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color var(--ease-smooth), background-color var(--ease-smooth), transform var(--ease-smooth), box-shadow var(--ease-smooth);
    }

    .checkbox-skin::after {
      content: "✓";
      font-size: 11px;
      font-weight: 800;
      color: #051321;
      opacity: 0;
      transform: scale(0.4) rotate(-10deg);
      transition: transform var(--ease-spring), opacity var(--ease-smooth);
    }

    .checkbox-shell:hover .checkbox-skin {
      border-color: var(--blue-soft);
    }

    .checkbox-native:checked + .checkbox-skin {
      border-color: var(--blue-primary);
      background-color: var(--blue-primary);
      box-shadow: 0 0 10px var(--blue-glow);
      transform: scale(1.04);
    }

    .checkbox-native:checked + .checkbox-skin::after {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .checkbox-native:focus-visible + .checkbox-skin {
      outline: 2px solid var(--blue-soft);
      outline-offset: 2px;
    }

    .task-content {
      flex: 1;
      min-width: 0;
      font-size: 0.96rem;
      font-weight: 500;
      color: var(--text-primary);
      word-break: break-word;
      transition: color var(--ease-smooth), text-decoration-color var(--ease-smooth);
    }

    .task-row.is-done {
      opacity: 0.55;
    }

    .task-row.is-done .task-content {
      text-decoration: line-through;
      text-decoration-color: var(--blue-primary);
      text-decoration-thickness: 1.5px;
      color: var(--text-secondary);
    }

    .task-delete-btn {
      background: transparent;
      border: 1px solid transparent;
      font-family: var(--font-main);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem 0.65rem;
      border-radius: var(--radius-sm);
      opacity: 0;
      flex-shrink: 0;
      transition: opacity var(--ease-smooth), color var(--ease-smooth), background-color var(--ease-smooth), transform var(--ease-smooth);
    }

    .task-row:hover .task-delete-btn,
    .task-row:focus-within .task-delete-btn {
      opacity: 1;
    }

    .task-delete-btn:hover {
      color: var(--danger-hover);
      background-color: var(--danger-bg);
      transform: translateY(-1px);
    }

    .task-delete-btn:active {
      transform: translateY(0);
    }

    .task-delete-btn:focus-visible {
      opacity: 1;
      outline: 2px solid var(--danger-hover);
      outline-offset: 1px;
    }

    .empty-state {
      text-align: center;
      padding: 4.5rem 1.5rem;
    }

    .empty-state[hidden] {
      display: none;
    }

    .empty-vector {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: var(--navy-surface);
      color: var(--blue-primary);
      margin-bottom: 1rem;
      border: 1px solid var(--border-subtle);
      transition: transform var(--ease-smooth);
    }

    .empty-state:hover .empty-vector {
      transform: scale(1.05);
    }

    .empty-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-pure);
    }

    .empty-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.35rem;
    }

    .sticky-panel {
      position: sticky;
      top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .panel-heading {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .metric-card {
      background-color: var(--navy-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1rem;
      transition: border-color var(--ease-smooth), background-color var(--ease-smooth);
    }

    .metric-card:hover {
      border-color: rgba(77, 163, 255, 0.25);
      background-color: var(--navy-surface);
    }

    .metric-number {
      display: block;
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
      color: var(--blue-primary);
      letter-spacing: -0.02em;
    }

    .metric-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-top: 0.4rem;
    }

    .filter-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .filter-link {
      background: transparent;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      transition: background-color var(--ease-smooth), color var(--ease-smooth), border-color var(--ease-smooth), transform var(--ease-smooth);
    }

    .filter-link:hover {
      background-color: var(--navy-surface);
      color: var(--text-primary);
      transform: translateX(2px);
    }

    .filter-link:focus-visible {
      outline: 2px solid var(--blue-soft);
      outline-offset: 1px;
    }

    .filter-link.is-active {
      background-color: var(--navy-surface);
      border-color: var(--border-subtle);
      color: var(--text-pure);
      font-weight: 600;
      transform: none;
    }

    .filter-link.is-active .filter-badge {
      background-color: var(--blue-subtle);
      color: var(--blue-primary);
    }

    .filter-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 100px;
      background-color: var(--navy-bg);
      color: var(--text-muted);
      transition: background-color var(--ease-smooth), color var(--ease-smooth);
    }

    .panel-footer {
      border-top: 1px solid var(--border-subtle);
      padding-top: 1.25rem;
    }

    .clear-btn {
      background: transparent;
      border: none;
      font-family: var(--font-main);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.5rem 0.4rem;
      border-radius: var(--radius-sm);
      transition: color var(--ease-smooth), background-color var(--ease-smooth);
    }

    .clear-btn:hover {
      color: var(--danger-hover);
      background-color: var(--danger-bg);
    }

    .clear-btn:focus-visible {
      outline: 2px solid var(--danger-hover);
      outline-offset: 1px;
    }

    .clear-icon {
      font-size: 1.15rem;
      line-height: 1;
    }

    @media (max-width: 900px) {
      .workspace-grid {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }
      .secondary-column {
        order: -1;
      }
      .sticky-panel {
        position: static;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
      .panel-footer {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 680px) {
      body {
        padding: 1.5rem 1rem;
      }
      .app-layout {
        gap: 1.75rem;
      }
      .app-topbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 1.25rem;
      }
      .brand-divider, .brand-tagline {
        display: none;
      }
      .hero-block {
        margin-bottom: 1.5rem;
      }
      .hero-title {
        font-size: 1.85rem;
      }
      .sticky-panel {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .filter-list {
        flex-direction: row;
        gap: 0.5rem;
      }
      .filter-link {
        flex: 1;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.6rem 0.5rem;
      }
      .filter-link:hover {
        transform: none;
      }
      .task-row {
        padding: 0.9rem 0.4rem;
        gap: 0.85rem;
      }
      .task-delete-btn {
        opacity: 0.8;
        padding: 0.45rem 0.6rem;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 1.25rem 0.75rem;
      }
      .hero-title {
        font-size: 1.65rem;
      }
      .hero-desc {
        font-size: 0.88rem;
      }
      .input-shell {
        padding: 0.35rem 0.4rem 0.35rem 0.85rem;
      }
      .composer-field {
        font-size: 0.9rem;
      }
      .composer-submit-btn {
        padding: 0.6rem 0.95rem;
        font-size: 0.82rem;
      }
      .filter-list {
        flex-direction: column;
        gap: 0.35rem;
      }
      .filter-link {
        justify-content: space-between;
        padding: 0.65rem 0.85rem;
      }
      .task-order {
        display: none;
      }
      .task-content {
        font-size: 0.92rem;
      }
      .task-delete-btn {
        font-size: 0.68rem;
        padding: 0.4rem 0.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background glow layers -->
  <div class="glow-orb glow-top-right" aria-hidden="true"></div>
  <div class="glow-orb glow-bottom-left" aria-hidden="true"></div>

  <div class="app-layout">
    
    <!-- Top Global Bar -->
    <header class="app-topbar">
      <div class="brand-group">
        <span class="brand-mark"></span>
        <span class="brand-logo">noto<span class="accent-dot">.</span></span>
        <span class="brand-divider">|</span>
        <span class="brand-tagline">A little space for what's next.</span>
      </div>

      <div class="topbar-meta">
        <span class="meta-label">TODAY</span>
        <time id="current-date" class="meta-time">—</time>
      </div>
    </header>

    <!-- Main Dynamic Workspace -->
    <div class="workspace-grid">
      
      <!-- Primary Column: Task Creation & Ledger List -->
      <main class="primary-column">
        
        <div class="hero-block">
          <h1 class="hero-title">What's next<span class="accent-dot">?</span></h1>
          <p class="hero-desc">Keep the little things moving.</p>
        </div>

        <!-- Sleek Custom Composer Form -->
        <form id="task-form" class="task-composer" novalidate>
          <label for="task-input" class="sr-only">Add a task</label>
          <div class="input-shell">
            <span class="input-icon" aria-hidden="true">+</span>
            <input 
              type="text" 
              id="task-input" 
              name="task" 
              class="composer-field" 
              placeholder="What's on your list?" 
              autocomplete="off" 
              required
            />
            <button type="submit" class="composer-submit-btn" aria-label="Add task to list">
              <span>Add</span>
              <span class="btn-arrow" aria-hidden="true">→</span>
            </button>
          </div>
        </form>

        <!-- Dynamic Task Feed -->
        <section class="task-feed" aria-label="Task Entries">
          <ol id="task-list" class="task-list">
            <!-- Rendered by JavaScript -->
          </ol>

          <!-- Minimalist Empty State -->
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-vector" aria-hidden="true">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 8v4l2.5 2.5"></path>
              </svg>
            </div>
            <p class="empty-title">Nothing here yet.</p>
            <p class="empty-subtitle">Add something small to get started.</p>
          </div>
        </section>

      </main>

      <!-- Secondary Column: Real-Time Stats & Quick Filters -->
      <aside class="secondary-column">
        <div class="sticky-panel">
          
          <!-- Statistics Widget -->
          <section class="panel-section" aria-label="Task Analytics">
            <h2 class="panel-heading">Metrics</h2>
            <div class="metrics-grid">
              <div class="metric-card">
                <span id="active-count" class="metric-number">0</span>
                <span class="metric-label">Remaining</span>
              </div>
              <div class="metric-card">
                <span id="completed-count" class="metric-number">0</span>
                <span class="metric-label">Completed</span>
              </div>
            </div>
          </section>

          <!-- Integrated Filter List -->
          <section class="panel-section" aria-label="View Filters">
            <h2 class="panel-heading">Filter View</h2>
            <div class="filter-list" role="tablist">
              <button type="button" class="filter-link is-active" data-filter="all" role="tab" aria-selected="true">
                <span class="filter-link-label">All</span>
                <span class="filter-badge" id="count-all">0</span>
              </button>
              <button type="button" class="filter-link" data-filter="active" role="tab" aria-selected="false">
                <span class="filter-link-label">Active</span>
                <span class="filter-badge" id="count-active">0</span>
              </button>
              <button type="button" class="filter-link" data-filter="completed" role="tab" aria-selected="false">
                <span class="filter-link-label">Completed</span>
                <span class="filter-badge" id="count-completed">0</span>
              </button>
            </div>
          </section>

          <!-- Maintenance / Actions -->
          <div class="panel-footer">
            <button type="button" id="clear-completed-btn" class="clear-btn">
              <span>Clear completed tasks</span>
              <span class="clear-icon">×</span>
            </button>
          </div>

        </div>
      </aside>

    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'noto_midnight_tasks';

      let tasks = [];
      let currentFilter = 'all';

      const taskForm = document.getElementById('task-form');
      const taskInput = document.getElementById('task-input');
      const taskList = document.getElementById('task-list');
      const emptyState = document.getElementById('empty-state');
      const activeCountEl = document.getElementById('active-count');
      const completedCountEl = document.getElementById('completed-count');
      const countAllEl = document.getElementById('count-all');
      const countActiveEl = document.getElementById('count-active');
      const countCompletedEl = document.getElementById('count-completed');
      const clearCompletedBtn = document.getElementById('clear-completed-btn');
      const filterLinks = document.querySelectorAll('.filter-link');
      const currentDateEl = document.getElementById('current-date');

      function init() {
        renderCurrentDate();
        loadTasks();
        bindEvents();
        render();
      }

      function renderCurrentDate() {
        const now = new Date();
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        currentDateEl.textContent = now.toLocaleDateString('en-US', options);
      }

      function loadTasks() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          tasks = stored ? JSON.parse(stored) : [];
          if (!Array.isArray(tasks)) tasks = [];
        } catch (err) {
          tasks = [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (err) {}
      }

      function bindEvents() {
        taskForm.addEventListener('submit', function (e) {
          e.preventDefault();
          const text = taskInput.value.trim();
          if (text.length > 0) {
            addTask(text);
            taskInput.value = '';
            taskInput.focus();
          }
        });

        clearCompletedBtn.addEventListener('click', clearCompletedTasks);

        filterLinks.forEach(link => {
          link.addEventListener('click', function () {
            const filter = this.getAttribute('data-filter');
            setFilter(filter);
          });
        });
      }

      function addTask(text) {
        const newTask = {
          id: 'noto_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
          text: text,
          completed: false,
          createdAt: new Date().toISOString()
        };

        tasks.unshift(newTask);
        saveTasks();
        render();
      }

      function toggleTask(id) {
        tasks = tasks.map(t => {
          if (t.id === id) {
            return Object.assign({}, t, { completed: !t.completed });
          }
          return t;
        });
        saveTasks();
        render();
      }

      function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        render();
      }

      function clearCompletedTasks() {
        const hasCompleted = tasks.some(t => t.completed);
        if (!hasCompleted) return;

        tasks = tasks.filter(t => !t.completed);
        saveTasks();
        render();
      }

      function setFilter(filter) {
        currentFilter = filter;
        filterLinks.forEach(link => {
          const isActive = link.getAttribute('data-filter') === filter;
          link.classList.toggle('is-active', isActive);
          link.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        render();
      }

      function getFilteredTasks() {
        if (currentFilter === 'active') {
          return tasks.filter(t => !t.completed);
        }
        if (currentFilter === 'completed') {
          return tasks.filter(t => t.completed);
        }
        return tasks;
      }

      function updateCounters() {
        const allTotal = tasks.length;
        const activeTotal = tasks.filter(t => !t.completed).length;
        const completedTotal = tasks.filter(t => t.completed).length;

        activeCountEl.textContent = activeTotal;
        completedCountEl.textContent = completedTotal;

        countAllEl.textContent = allTotal;
        countActiveEl.textContent = activeTotal;
        countCompletedEl.textContent = completedTotal;
      }

      function createTaskElement(task, index) {
        const li = document.createElement('li');
        li.className = 'task-row' + (task.completed ? ' is-done' : '');
        li.id = task.id;

        const orderSpan = document.createElement('span');
        orderSpan.className = 'task-order';
        orderSpan.textContent = String(index + 1).padStart(2, '0');

        const checkShell = document.createElement('label');
        checkShell.className = 'checkbox-shell';

        const checkNative = document.createElement('input');
        checkNative.type = 'checkbox';
        checkNative.className = 'checkbox-native';
        checkNative.checked = task.completed;
        checkNative.setAttribute('aria-label', `Mark "${task.text}" as ${task.completed ? 'active' : 'completed'}`);
        checkNative.addEventListener('change', () => toggleTask(task.id));

        const checkSkin = document.createElement('span');
        checkSkin.className = 'checkbox-skin';

        checkShell.appendChild(checkNative);
        checkShell.appendChild(checkSkin);

        const textSpan = document.createElement('span');
        textSpan.className = 'task-content';
        textSpan.textContent = task.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'task-delete-btn';
        deleteBtn.textContent = 'Remove';
        deleteBtn.setAttribute('aria-label', `Delete "${task.text}"`);
        deleteBtn.addEventListener('click', () => deleteTask(task.id));

        li.appendChild(orderSpan);
        li.appendChild(checkShell);
        li.appendChild(textSpan);
        li.appendChild(deleteBtn);

        return li;
      }

      function render() {
        updateCounters();

        const filtered = getFilteredTasks();
        taskList.innerHTML = '';

        if (filtered.length === 0) {
          emptyState.removeAttribute('hidden');
        } else {
          emptyState.setAttribute('hidden', 'true');
          const fragment = document.createDocumentFragment();
          filtered.forEach((task, idx) => {
            fragment.appendChild(createTaskElement(task, idx));
          });
          taskList.appendChild(fragment);
        }
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
